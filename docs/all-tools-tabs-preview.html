<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SubLens · Homepage and All tools preview</title>
    <style>
      :root {
        color-scheme: light;
        --page: #ececf1;
        --popup: #f7f7f9;
        --surface: #ffffff;
        --surface-soft: #f0eff5;
        --border: #dedee6;
        --border-strong: #c7c7d2;
        --text: #202128;
        --muted: #636775;
        --subtle: #757987;
        --accent: #6d3bd1;
        --accent-soft: rgba(109, 59, 209, 0.1);
        --focus: #6d3bd1;
        --shadow: 0 18px 50px rgba(42, 37, 56, 0.16);
      }

      [data-theme="dark"] {
        color-scheme: dark;
        --page: #090b10;
        --popup: #0f1117;
        --surface: #1b1e29;
        --surface-soft: #242735;
        --border: #2b3040;
        --border-strong: #3d4356;
        --text: #f1f3f8;
        --muted: #aeb3c3;
        --subtle: #9096a9;
        --accent: #aa8cff;
        --accent-soft: rgba(170, 140, 255, 0.14);
        --focus: #c4b5fd;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--page);
      }

      body {
        min-height: 100dvh;
        margin: 0;
        padding: 28px 16px;
        background:
          radial-gradient(circle at 50% 0%, var(--accent-soft), transparent 38%), var(--page);
        color: var(--text);
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "Segoe UI",
          sans-serif;
      }

      button {
        font: inherit;
        touch-action: manipulation;
      }

      button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .preview {
        width: min(400px, 100%);
        margin: 0 auto;
      }

      .preview-bar {
        display: flex;
        min-height: 52px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
        padding: 8px 10px 8px 14px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: color-mix(in srgb, var(--surface) 92%, transparent);
        box-shadow: 0 8px 30px rgba(42, 37, 56, 0.08);
      }

      .preview-copy {
        display: grid;
        min-width: 0;
        gap: 2px;
      }

      .preview-copy strong {
        overflow: hidden;
        font-size: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .preview-copy small {
        color: var(--muted);
        font-size: 11px;
      }

      .preview-badge {
        display: inline-flex;
        min-height: 28px;
        align-items: center;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface-soft);
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
      }

      .theme-button {
        display: grid;
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface-soft);
        color: var(--accent);
        cursor: pointer;
        transition:
          background-color 180ms ease-out,
          border-color 180ms ease-out;
      }

      .theme-button:hover {
        border-color: var(--border-strong);
      }

      .theme-button svg {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .theme-button .moon,
      [data-theme="dark"] .theme-button .sun {
        display: none;
      }

      [data-theme="dark"] .theme-button .moon {
        display: block;
      }

      .popup {
        position: relative;
        height: min(700px, calc(100dvh - 118px));
        min-height: 520px;
        overflow-x: hidden;
        overflow-y: auto;
        scrollbar-gutter: stable;
        padding: 12px 12px 22px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--popup);
        box-shadow: var(--shadow);
        overscroll-behavior: contain;
      }

      .app-header,
      .brand-lockup,
      .header-actions,
      .subscription-summary,
      .section-heading-row {
        display: flex;
        align-items: center;
      }

      .app-header {
        min-height: 44px;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 12px;
      }

      .brand-lockup {
        min-width: 0;
        gap: 9px;
      }

      .brand-mark {
        display: grid;
        width: 32px;
        height: 32px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font-size: 13px;
        font-weight: 800;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
      }

      .brand-copy {
        display: grid;
        min-width: 0;
      }

      .brand-copy strong {
        font-size: 15px;
        letter-spacing: -0.02em;
        line-height: 18px;
      }

      .brand-copy small {
        color: var(--muted);
        font-size: 11px;
        line-height: 16px;
      }

      .header-actions {
        flex: 0 0 auto;
        gap: 2px;
      }

      .icon-button {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border: 0;
        border-radius: 14px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }

      .icon-button:hover {
        background: var(--surface-soft);
        color: var(--text);
      }

      .icon-button svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .language-button {
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.04em;
      }

      .app-header .theme-button {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .refresh-button.is-refreshing svg {
        animation: refresh-spin 700ms linear infinite;
      }

      .search-wrap {
        position: relative;
        display: flex;
        min-width: 0;
        align-items: center;
        margin-bottom: 12px;
        padding: 3px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: 0 8px 24px rgba(18, 18, 24, 0.06);
      }

      .search-wrap:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .search-icon {
        position: absolute;
        left: 14px;
        width: 18px;
        height: 18px;
        fill: none;
        stroke: var(--muted);
        stroke-linecap: round;
        stroke-width: 1.8;
        pointer-events: none;
      }

      .search-wrap input {
        width: 100%;
        min-width: 0;
        height: 48px;
        padding: 0 56px 0 40px;
        border: 0;
        border-radius: 14px;
        outline: 0;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 13px;
      }

      .search-wrap input::placeholder {
        color: var(--subtle);
      }

      .search-wrap kbd {
        position: absolute;
        right: 11px;
        padding: 4px 7px;
        border-radius: 9px;
        background: var(--accent-soft);
        color: var(--muted);
        font-family: inherit;
        font-size: 10px;
      }

      .page-tabs {
        display: grid;
        width: 100%;
        min-width: 0;
        height: 52px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 3px;
        margin-bottom: 12px;
        padding: 3px;
        border: 1px solid var(--border);
        border-radius: 17px;
        background: var(--surface-soft);
      }

      .page-tabs button {
        display: inline-flex;
        min-width: 0;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 0 10px;
        border: 1px solid transparent;
        border-radius: 14px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
      }

      .page-tabs button:hover {
        color: var(--text);
      }

      .page-tabs button[aria-selected="true"] {
        border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
        background: var(--surface);
        color: var(--accent);
        box-shadow: 0 1px 3px rgba(42, 37, 56, 0.14);
      }

      .page-tabs svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.7;
      }

      .home-content {
        display: grid;
        width: 100%;
        min-width: 0;
        gap: 12px;
      }

      .home-content > section,
      .search-panel,
      .tools-view {
        width: 100%;
        min-width: 0;
      }

      .tools-view {
        display: grid;
        gap: 10px;
      }

      .tools-view .search-wrap {
        margin-bottom: 0;
      }

      [hidden] {
        display: none !important;
      }

      .subscription-summary {
        width: 100%;
        min-width: 0;
        min-height: 54px;
        gap: 12px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        text-align: left;
      }

      .subscription-summary:hover {
        border-color: var(--border-strong);
      }

      .subscription-summary > span:not(.summary-divider):not(.summary-action) {
        display: grid;
      }

      .subscription-summary strong {
        font-size: 15px;
        font-variant-numeric: tabular-nums;
      }

      .subscription-summary small {
        color: var(--muted);
        font-size: 10px;
      }

      .summary-divider {
        width: 1px;
        height: 28px;
        background: var(--border);
      }

      .summary-action {
        margin-left: auto;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
      }

      .section-heading-row {
        min-height: 24px;
        justify-content: space-between;
        margin-bottom: 7px;
      }

      .section-heading-row h2,
      .search-results-heading {
        display: inline-flex;
        margin: 0;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .section-count {
        display: inline-grid;
        min-width: 20px;
        height: 20px;
        place-items: center;
        padding: 0 6px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
        color: var(--subtle);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        font-weight: 650;
      }

      .favorite-grid {
        display: grid;
        width: 100%;
        min-width: 0;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .favorite-item {
        display: flex;
        min-width: 0;
        min-height: 64px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 8px 5px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
      }

      .favorite-item:hover,
      .recent-tool:hover {
        border-color: var(--border-strong);
        background: var(--surface-soft);
      }

      .favorite-item > span:last-child {
        max-width: 100%;
        overflow: hidden;
        font-size: 11px;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .favorite-item .tool-logo {
        width: 32px;
        height: 32px;
        border-radius: 9px;
      }

      .favorite-item .tool-logo img {
        width: 21px;
        height: 21px;
      }

      .search-panel {
        display: none;
      }

      .search-panel.is-visible {
        display: block;
      }

      .search-results-heading {
        min-height: 24px;
        margin-bottom: 7px;
      }

      .empty-state {
        display: grid;
        min-height: 120px;
        place-content: center;
        gap: 4px;
        padding: 20px;
        border: 1px dashed var(--border-strong);
        border-radius: 14px;
        color: var(--muted);
        text-align: center;
      }

      .empty-state strong {
        color: var(--text);
        font-size: 13px;
      }

      .empty-state span {
        font-size: 11px;
      }

      .notice-toast {
        position: absolute;
        z-index: 4;
        right: 24px;
        bottom: 28px;
        left: 24px;
        padding: 10px 12px;
        border: 1px solid var(--border-strong);
        border-radius: 12px;
        background: var(--surface);
        color: var(--text);
        box-shadow: var(--shadow);
        font-size: 11px;
        font-weight: 650;
        text-align: center;
      }

      .section-heading {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .recent-list {
        display: flex;
        width: 100%;
        min-width: 0;
        gap: 8px;
        margin-bottom: 16px;
        overflow-x: auto;
        padding-bottom: 2px;
        scrollbar-width: none;
      }

      .recent-list::-webkit-scrollbar {
        display: none;
      }

      .recent-tool {
        display: inline-flex;
        min-width: max-content;
        min-height: 48px;
        align-items: center;
        gap: 8px;
        padding: 7px 12px 7px 7px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        font-size: 11px;
        font-weight: 650;
      }

      .tool-logo {
        display: grid;
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        overflow: hidden;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 11px;
        background: var(--surface-soft);
      }

      .recent-tool .tool-logo {
        width: 32px;
        height: 32px;
        border-radius: 9px;
      }

      .tool-logo img {
        display: block;
        width: 26px;
        height: 26px;
        object-fit: contain;
      }

      .recent-tool .tool-logo img {
        width: 21px;
        height: 21px;
      }

      .tool-logo[data-frame="app"] img {
        width: 100%;
        height: 100%;
        border-radius: inherit;
      }

      [data-theme="dark"] .tool-logo img[data-tone="adaptive"] {
        filter: invert(1);
      }

      .category-tabs {
        display: grid;
        width: 100%;
        min-width: 0;
        height: 52px;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 3px;
        margin-bottom: 10px;
        padding: 3px;
        border: 1px solid var(--border);
        border-radius: 17px;
        background: var(--surface-soft);
      }

      .category-tabs button {
        display: inline-flex;
        min-width: 0;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 0 7px;
        border: 1px solid transparent;
        border-radius: 14px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 11px;
        font-weight: 650;
        white-space: nowrap;
        transition:
          background-color 180ms ease-out,
          border-color 180ms ease-out,
          color 180ms ease-out,
          box-shadow 180ms ease-out;
      }

      .category-tabs button:hover {
        color: var(--text);
      }

      .category-tabs button[aria-selected="true"] {
        border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
        background: var(--surface);
        color: var(--accent);
        box-shadow: 0 1px 3px rgba(42, 37, 56, 0.14);
      }

      .tab-count {
        display: inline-grid;
        min-width: 20px;
        height: 20px;
        place-items: center;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 10px;
        font-variant-numeric: tabular-nums;
        font-weight: 750;
      }

      .tool-list {
        display: grid;
        min-width: 0;
        gap: 7px;
      }

      .tool-card {
        display: grid;
        min-width: 0;
        min-height: 64px;
        grid-template-columns: auto minmax(0, 1fr) 44px;
        align-items: center;
        gap: 10px;
        padding: 10px 7px 10px 10px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        cursor: pointer;
        animation: card-in 180ms ease-out both;
      }

      .tool-card:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .tool-copy {
        display: grid;
        min-width: 0;
        gap: 2px;
      }

      .tool-copy strong,
      .tool-copy small {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .tool-copy strong {
        font-size: 13px;
      }

      .tool-copy small {
        color: var(--muted);
        font-size: 11px;
      }

      .favorite-button {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: var(--accent);
        cursor: pointer;
      }

      .favorite-button:hover {
        background: var(--accent-soft);
      }

      .favorite-button svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
        stroke: currentColor;
        stroke-linejoin: round;
        stroke-width: 1.6;
      }

      .favorite-button[aria-pressed="false"] {
        color: var(--subtle);
      }

      .favorite-button[aria-pressed="false"] svg {
        fill: none;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      @keyframes card-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
      }

      @keyframes refresh-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 380px) {
        .category-tabs {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }

        .category-tabs button {
          padding-inline: 4px;
          font-size: 10px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="preview" aria-labelledby="preview-title">
      <header class="preview-bar">
        <span class="preview-copy">
          <strong id="preview-title">SubLens homepage</strong>
          <small data-i18n="previewSubtitle">Interactive UI preview · 400px</small>
        </span>
        <span class="preview-badge" data-i18n="previewBadge">Full homepage</span>
      </header>

      <section class="popup" aria-label="SubLens popup preview">
        <header class="app-header">
          <div class="brand-lockup">
            <span class="brand-mark" aria-hidden="true">S</span>
            <span class="brand-copy">
              <strong>SubLens</strong>
              <small data-i18n="tagline">AI launcher</small>
            </span>
          </div>
          <div class="header-actions">
            <button
              class="icon-button language-button"
              type="button"
              aria-label="Switch language to Chinese"
              title="Switch language to Chinese"
            >
              EN
            </button>
            <button
              class="theme-button icon-button"
              type="button"
              aria-label="Switch to dark theme"
              title="Switch to dark theme"
            >
              <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path
                  d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"
                />
              </svg>
              <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.2 15.7A8.5 8.5 0 0 1 8.3 3.8a8.5 8.5 0 1 0 11.9 11.9Z" />
              </svg>
            </button>
            <button
              class="icon-button refresh-button"
              type="button"
              aria-label="Refresh subscriptions"
              title="Refresh subscriptions"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7" />
              </svg>
            </button>
          </div>
        </header>

        <div class="page-tabs" role="tablist" aria-label="Main views">
          <button
            id="page-tab-home"
            type="button"
            role="tab"
            aria-controls="home-view"
            aria-selected="true"
            data-view="home"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m3 11 9-7 9 7v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-9Z" />
            </svg>
            <span data-i18n="home">Home</span>
          </button>
          <button
            id="page-tab-tools"
            type="button"
            role="tab"
            aria-controls="tools-view"
            aria-selected="false"
            tabindex="-1"
            data-view="tools"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 6h13M8 12h13M8 18h13" />
              <path d="M3 6h.01M3 12h.01M3 18h.01" />
            </svg>
            <span data-i18n="allTools">Tools</span>
            <span class="tab-count" aria-hidden="true">14</span>
          </button>
        </div>

        <div id="home-view" class="home-content" role="tabpanel" aria-labelledby="page-tab-home">
          <button class="subscription-summary" type="button">
            <span>
              <strong>0</strong>
              <small data-i18n="paid">Paid</small>
            </span>
            <span class="summary-divider" aria-hidden="true"></span>
            <span>
              <strong>$0.00</strong>
              <small data-i18n="monthly">Monthly</small>
            </span>
            <span class="summary-action" data-i18n="manage">Manage</span>
          </button>

          <section aria-labelledby="favorites-title">
            <div class="section-heading-row">
              <h2 id="favorites-title">
                <span data-i18n="favorites">Favorites</span>
                <span class="section-count" id="favorite-count">9</span>
              </h2>
            </div>
            <div id="favorite-grid" class="favorite-grid"></div>
          </section>

          <section aria-labelledby="recent-title">
            <div class="section-heading-row">
              <h2 id="recent-title" data-i18n="recent">Recent</h2>
            </div>
            <div id="recent-list" class="recent-list" aria-label="Recent tools"></div>
          </section>
        </div>

        <section
          id="tools-view"
          class="tools-view"
          role="tabpanel"
          aria-labelledby="page-tab-tools"
          hidden
        >
          <label class="search-wrap">
            <span class="visually-hidden" data-i18n="searchLabel">Search tools</span>
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m16 16 4 4" />
            </svg>
            <input
              id="tool-search"
              type="search"
              autocomplete="off"
              spellcheck="false"
              placeholder="Search tools"
            />
            <kbd>⌘K</kbd>
          </label>

          <section class="search-panel" aria-labelledby="search-results-title">
            <h2 id="search-results-title" class="search-results-heading">
              <span data-i18n="searchResults">Search results</span>
              <span class="section-count" id="search-count">0</span>
            </h2>
            <div id="search-list" class="tool-list"></div>
          </section>

          <div class="category-tabs" role="tablist" aria-label="Tool categories">
            <button
              id="tab-all"
              type="button"
              role="tab"
              aria-controls="tool-list"
              aria-selected="true"
              data-category="all"
              data-i18n="all"
            >
              All
            </button>
            <button
              id="tab-chat"
              type="button"
              role="tab"
              aria-controls="tool-list"
              aria-selected="false"
              tabindex="-1"
              data-category="chat"
              data-i18n="chat"
            >
              Chat
            </button>
            <button
              id="tab-create"
              type="button"
              role="tab"
              aria-controls="tool-list"
              aria-selected="false"
              tabindex="-1"
              data-category="create"
              data-i18n="create"
            >
              Create
            </button>
            <button
              id="tab-code"
              type="button"
              role="tab"
              aria-controls="tool-list"
              aria-selected="false"
              tabindex="-1"
              data-category="code"
              data-i18n="code"
            >
              Code
            </button>
            <button
              id="tab-explore"
              type="button"
              role="tab"
              aria-controls="tool-list"
              aria-selected="false"
              tabindex="-1"
              data-category="explore"
              data-i18n="explore"
            >
              Explore
            </button>
          </div>

          <div id="tool-list" class="tool-list" role="tabpanel" aria-labelledby="tab-all"></div>
        </section>
        <p class="visually-hidden" aria-live="polite" id="result-status"></p>
        <div class="notice-toast" role="status" hidden></div>
      </section>
    </main>

    <script>
      const tools = [
        {
          id: "chatgpt",
          name: "ChatGPT",
          category: "chat",
          detail: "Chat",
          detailZh: "对话",
          logo: "chatgpt.svg",
          favorite: true,
        },
        {
          id: "claude",
          name: "Claude",
          category: "chat",
          detail: "Chat",
          detailZh: "对话",
          logo: "claude.svg",
          tone: "native",
          favorite: true,
        },
        {
          id: "gemini",
          name: "Gemini",
          category: "chat",
          detail: "Chat",
          detailZh: "对话",
          logo: "gemini.svg",
          tone: "color",
          favorite: true,
        },
        {
          id: "deepseek",
          name: "DeepSeek",
          category: "chat",
          detail: "Chat",
          detailZh: "对话",
          logo: "deepseek.svg",
          tone: "color",
          favorite: true,
        },
        {
          id: "grok",
          name: "Grok",
          category: "chat",
          detail: "Chat",
          detailZh: "对话",
          logo: "grok.svg",
          tone: "color",
          frame: "app",
          favorite: true,
        },
        {
          id: "midjourney",
          name: "Midjourney",
          category: "create",
          detail: "Image creation",
          detailZh: "图像创作",
          logo: "midjourney.svg",
          favorite: false,
        },
        {
          id: "runway",
          name: "Runway",
          category: "create",
          detail: "Video creation",
          detailZh: "视频创作",
          logo: "runway.svg",
          favorite: false,
        },
        {
          id: "kling",
          name: "Kling AI",
          category: "create",
          detail: "Video creation",
          detailZh: "视频创作",
          logo: "kling.svg",
          tone: "color",
          favorite: false,
        },
        {
          id: "cursor",
          name: "Cursor",
          category: "code",
          detail: "Code",
          detailZh: "编程",
          logo: "cursor.svg",
          frame: "app",
          favorite: true,
        },
        {
          id: "copilot",
          name: "GitHub Copilot",
          category: "code",
          detail: "Code",
          detailZh: "编程",
          logo: "copilot.svg",
          favorite: true,
        },
        {
          id: "codex",
          name: "Codex",
          category: "code",
          detail: "Code",
          detailZh: "编程",
          logo: "codex.svg",
          tone: "native",
          favorite: true,
        },
        {
          id: "huggingface",
          name: "Hugging Face",
          category: "explore",
          detail: "AI platform",
          detailZh: "AI 平台",
          logo: "huggingface.svg",
          tone: "color",
          favorite: false,
        },
        {
          id: "openrouter",
          name: "OpenRouter",
          category: "explore",
          detail: "AI platform",
          detailZh: "AI 平台",
          logo: "openrouter.png",
          tone: "color",
          frame: "app",
          favorite: true,
        },
        {
          id: "notebooklm",
          name: "NotebookLM",
          category: "explore",
          detail: "Research",
          detailZh: "研究",
          logo: "notebooklm.svg",
          favorite: false,
        },
      ];

      const messages = {
        en: {
          previewSubtitle: "Interactive UI preview · 400px",
          previewBadge: "Full homepage",
          tagline: "AI launcher",
          searchLabel: "Search tools",
          searchPlaceholder: "Search tools",
          searchResults: "Search results",
          paid: "Paid",
          monthly: "Monthly",
          manage: "Manage",
          home: "Home",
          favorites: "Favorites",
          recent: "Recent",
          allTools: "Tools",
          all: "All",
          chat: "Chat",
          create: "Create",
          code: "Code",
          explore: "Explore",
          noResults: "No tools found",
          tryAnother: "Try another keyword or category.",
          switchedLanguage: "Language switched to English",
          refreshed: "Subscription preview refreshed",
          manageNotice: "Subscription management preview",
          opened: "Would open",
          added: "Added to favorites",
          removed: "Removed from favorites",
          switchLanguage: "Switch language to Chinese",
          switchTheme: "Switch to dark theme",
          refresh: "Refresh subscriptions",
        },
        zh: {
          previewSubtitle: "交互式 UI 预览 · 400px",
          previewBadge: "完整主页",
          tagline: "AI 启动器",
          searchLabel: "搜索工具",
          searchPlaceholder: "搜索工具",
          searchResults: "搜索结果",
          paid: "付费",
          monthly: "月付",
          manage: "管理",
          home: "主页",
          favorites: "收藏",
          recent: "最近使用",
          allTools: "工具",
          all: "全部",
          chat: "对话",
          create: "创作",
          code: "编程",
          explore: "探索",
          noResults: "未找到工具",
          tryAnother: "请尝试其他关键词或分类。",
          switchedLanguage: "语言已切换为中文",
          refreshed: "订阅预览已刷新",
          manageNotice: "订阅管理预览",
          opened: "将打开",
          added: "已加入收藏",
          removed: "已取消收藏",
          switchLanguage: "切换语言至英语",
          switchTheme: "切换至浅色主题",
          refresh: "刷新订阅状态",
        },
      };

      let locale = "en";
      let activeView = "home";
      let activeCategory = "all";
      let toastTimer;
      const list = document.querySelector("#tool-list");
      const pageTabList = document.querySelector(".page-tabs");
      const pageTabs = [...document.querySelectorAll('.page-tabs [role="tab"]')];
      const categoryTabList = document.querySelector(".category-tabs");
      const categoryTabs = [...document.querySelectorAll('.category-tabs [role="tab"]')];
      const resultStatus = document.querySelector("#result-status");
      const themeButton = document.querySelector(".theme-button");
      const languageButton = document.querySelector(".language-button");
      const refreshButton = document.querySelector(".refresh-button");
      const searchInput = document.querySelector("#tool-search");
      const homeContent = document.querySelector(".home-content");
      const toolsView = document.querySelector(".tools-view");
      const searchPanel = document.querySelector(".search-panel");
      const searchList = document.querySelector("#search-list");
      const searchCount = document.querySelector("#search-count");
      const favoriteGrid = document.querySelector("#favorite-grid");
      const favoriteCount = document.querySelector("#favorite-count");
      const recentList = document.querySelector("#recent-list");
      const toast = document.querySelector(".notice-toast");

      function logoMarkup(tool, size = "medium") {
        return `
          <span class="tool-logo"${tool.frame ? ' data-frame="app"' : ""}>
            <img src="../public/logos/${tool.logo}" alt="" data-tone="${tool.tone ?? "adaptive"}" />
          </span>
        `;
      }

      function detailFor(tool) {
        return locale === "zh" ? tool.detailZh : tool.detail;
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        toast.textContent = message;
        toast.hidden = false;
        toastTimer = setTimeout(() => {
          toast.hidden = true;
        }, 1800);
      }

      function toolCard(tool, index) {
        const article = document.createElement("article");
        article.className = "tool-card";
        article.dataset.toolId = tool.id;
        article.tabIndex = 0;
        article.setAttribute("aria-label", `${messages[locale].opened} ${tool.name}`);
        article.style.animationDelay = `${Math.min(index * 24, 144)}ms`;
        article.innerHTML = `
          ${logoMarkup(tool)}
          <span class="tool-copy">
            <strong>${tool.name}</strong>
            <small>${detailFor(tool)}</small>
          </span>
          <button class="favorite-button" type="button" aria-label="Toggle favorite ${tool.name}" aria-pressed="${tool.favorite}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.78 5.63 6.22.9-4.5 4.39 1.06 6.2L12 17.2l-5.56 2.92 1.06-6.2L3 9.53l6.22-.9L12 3Z" /></svg>
          </button>
        `;
        return article;
      }

      function renderTools(category) {
        const visibleTools =
          category === "all" ? tools : tools.filter((tool) => tool.category === category);
        list.replaceChildren(...visibleTools.map(toolCard));
        resultStatus.textContent = `${visibleTools.length} ${category} tools shown`;
      }

      function renderFavorites() {
        const favorites = tools.filter((tool) => tool.favorite);
        favoriteCount.textContent = favorites.length;
        favoriteGrid.replaceChildren(
          ...favorites.map((tool) => {
            const button = document.createElement("button");
            button.className = "favorite-item";
            button.type = "button";
            button.dataset.toolId = tool.id;
            button.innerHTML = `${logoMarkup(tool, "small")}<span>${tool.name}</span>`;
            return button;
          })
        );
      }

      function renderRecent() {
        const recentIds = ["copilot", "deepseek", "grok", "cursor"];
        recentList.replaceChildren(
          ...recentIds.map((id) => {
            const tool = tools.find((candidate) => candidate.id === id);
            const button = document.createElement("button");
            button.className = "recent-tool";
            button.type = "button";
            button.dataset.toolId = tool.id;
            button.innerHTML = `${logoMarkup(tool, "small")}<span>${tool.name}</span>`;
            return button;
          })
        );
      }

      function renderSearch() {
        const query = searchInput.value.trim().toLocaleLowerCase();
        const results = tools.filter((tool) =>
          [tool.name, tool.category, tool.detail, tool.detailZh].some((value) =>
            value.toLocaleLowerCase().includes(query)
          )
        );
        searchCount.textContent = results.length;
        if (results.length) {
          searchList.replaceChildren(...results.map(toolCard));
        } else {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          empty.innerHTML = `<strong>${messages[locale].noResults}</strong><span>${messages[locale].tryAnother}</span>`;
          searchList.replaceChildren(empty);
        }
      }

      function updatePageVisibility() {
        pageTabList.hidden = false;
        homeContent.hidden = activeView !== "home";
        toolsView.hidden = activeView !== "tools";
      }

      function updateSearchVisibility(searching) {
        searchPanel.classList.toggle("is-visible", searching);
        categoryTabList.hidden = searching;
        list.hidden = searching;
      }

      function selectPageTab(tab, moveFocus = false) {
        activeView = tab.dataset.view;
        pageTabs.forEach((candidate) => {
          const selected = candidate === tab;
          candidate.setAttribute("aria-selected", String(selected));
          candidate.tabIndex = selected ? 0 : -1;
        });
        searchInput.value = "";
        updateSearchVisibility(false);
        updatePageVisibility();
        document.querySelector(".popup").scrollTop = 0;
        history.replaceState(null, "", activeView === "home" ? "#home" : "#all-tools");
        if (moveFocus) tab.focus();
      }

      function selectCategoryTab(tab, moveFocus = false) {
        activeCategory = tab.dataset.category;
        categoryTabs.forEach((candidate) => {
          const selected = candidate === tab;
          candidate.setAttribute("aria-selected", String(selected));
          candidate.tabIndex = selected ? 0 : -1;
        });
        list.setAttribute("aria-labelledby", tab.id);
        renderTools(activeCategory);
        if (moveFocus) tab.focus();
      }

      pageTabs.forEach((tab, index) => {
        tab.addEventListener("click", () => selectPageTab(tab));
        tab.addEventListener("keydown", (event) => {
          if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
          event.preventDefault();
          const nextIndex =
            event.key === "Home"
              ? 0
              : event.key === "End"
                ? pageTabs.length - 1
                : (index + (event.key === "ArrowRight" ? 1 : -1) + pageTabs.length) %
                  pageTabs.length;
          selectPageTab(pageTabs[nextIndex], true);
        });
      });

      categoryTabs.forEach((tab, index) => {
        tab.addEventListener("click", () => selectCategoryTab(tab));
        tab.addEventListener("keydown", (event) => {
          if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
          event.preventDefault();
          const nextIndex =
            event.key === "Home"
              ? 0
              : event.key === "End"
                ? categoryTabs.length - 1
                : (index + (event.key === "ArrowRight" ? 1 : -1) + categoryTabs.length) %
                  categoryTabs.length;
          selectCategoryTab(categoryTabs[nextIndex], true);
        });
      });

      document.addEventListener("click", (event) => {
        const favoriteButton = event.target.closest(".favorite-button");
        if (favoriteButton) {
          event.stopPropagation();
          const card = favoriteButton.closest(".tool-card");
          const tool = tools.find((candidate) => candidate.id === card.dataset.toolId);
          tool.favorite = !tool.favorite;
          favoriteButton.setAttribute("aria-pressed", String(tool.favorite));
          renderFavorites();
          showToast(`${messages[locale][tool.favorite ? "added" : "removed"]}: ${tool.name}`);
          return;
        }

        const toolTarget = event.target.closest("[data-tool-id]");
        if (toolTarget) {
          const tool = tools.find((candidate) => candidate.id === toolTarget.dataset.toolId);
          showToast(`${messages[locale].opened} ${tool.name}`);
        }
      });

      function updateThemeButtonLabel() {
        const dark = document.documentElement.dataset.theme === "dark";
        const label = dark
          ? locale === "zh"
            ? "切换至浅色主题"
            : "Switch to light theme"
          : locale === "zh"
            ? "切换至深色主题"
            : "Switch to dark theme";
        themeButton.setAttribute("aria-label", label);
        themeButton.title = label;
      }

      themeButton.addEventListener("click", () => {
        const dark = document.documentElement.dataset.theme === "dark";
        document.documentElement.dataset.theme = dark ? "light" : "dark";
        updateThemeButtonLabel();
      });

      languageButton.addEventListener("click", () => {
        locale = locale === "en" ? "zh" : "en";
        document.documentElement.lang = locale === "zh" ? "zh-CN" : "en";
        document.querySelectorAll("[data-i18n]").forEach((element) => {
          element.textContent = messages[locale][element.dataset.i18n];
        });
        searchInput.placeholder = messages[locale].searchPlaceholder;
        languageButton.textContent = locale.toUpperCase();
        languageButton.setAttribute("aria-label", messages[locale].switchLanguage);
        languageButton.title = messages[locale].switchLanguage;
        refreshButton.setAttribute("aria-label", messages[locale].refresh);
        refreshButton.title = messages[locale].refresh;
        updateThemeButtonLabel();
        renderFavorites();
        renderRecent();
        renderTools(activeCategory);
        if (searchInput.value) renderSearch();
        showToast(messages[locale].switchedLanguage);
      });

      searchInput.addEventListener("input", () => {
        const searching = Boolean(searchInput.value.trim());
        updateSearchVisibility(searching);
        if (searching) renderSearch();
      });

      searchInput.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        searchInput.value = "";
        updateSearchVisibility(false);
      });

      document.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key.toLocaleLowerCase() === "k") {
          event.preventDefault();
          if (activeView !== "tools") {
            const toolsPageTab = pageTabs.find((tab) => tab.dataset.view === "tools");
            selectPageTab(toolsPageTab);
          }
          searchInput.focus();
        }
        if ((event.key === "Enter" || event.key === " ") && event.target.matches(".tool-card")) {
          event.preventDefault();
          const tool = tools.find((candidate) => candidate.id === event.target.dataset.toolId);
          showToast(`${messages[locale].opened} ${tool.name}`);
        }
      });

      refreshButton.addEventListener("click", () => {
        refreshButton.disabled = true;
        refreshButton.classList.add("is-refreshing");
        setTimeout(() => {
          refreshButton.disabled = false;
          refreshButton.classList.remove("is-refreshing");
          showToast(messages[locale].refreshed);
        }, 700);
      });

      document.querySelector(".subscription-summary").addEventListener("click", () => {
        showToast(messages[locale].manageNotice);
      });

      renderFavorites();
      renderRecent();
      renderTools("all");
      const initialPageTab = pageTabs.find(
        (tab) => tab.dataset.view === (location.hash === "#all-tools" ? "tools" : "home")
      );
      selectPageTab(initialPageTab);
    </script>
  </body>
</html>
